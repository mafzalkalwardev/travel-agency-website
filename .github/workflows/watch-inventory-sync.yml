name: Watch Inventory Sync Health

# Runs on GitHub (free public runners) — does NOT hit TravelLine scrape.
# Checks inventory-cache mirror age; emails admin if older than 3 hours.
# Alert cooldown: every 12 hours while still stale.
# (GitHub schedule delays often create 1–3h gaps; 20m was too tight.)

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

concurrency:
  group: watch-inventory-sync
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check inventory mirror freshness
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BOOKING_FROM_EMAIL: ${{ secrets.BOOKING_FROM_EMAIL }}
          BOOKING_ADMIN_EMAIL: ${{ secrets.BOOKING_ADMIN_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: npx tsx scripts/run-inventory-health-watch.ts
