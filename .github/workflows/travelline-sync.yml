name: Inventory Ticket Sync

# Primary automatic inventory sync.
#
# GitHub's native `*/5` schedule is unreliable (often delayed hours).
# Instead we start a long runner every 4 hours that curls production
# every 5 minutes for up to ~6 hours (with overlap so there is no gap).
# Overlap is safe: sync_locks skip concurrent scrapes.
#
# IMPORTANT: always use the www host + trailing slash. The apex domain
# returns HTTP 308 to www; curl does not follow redirects by default.

on:
  schedule:
    # Refresh the 6-hour sync loop before the previous one times out.
    - cron: "2 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "once = single sync; loop = keep syncing every 5 min"
        type: choice
        options:
          - once
          - loop
        default: once

concurrency:
  group: travelline-ticket-sync-loop
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Sync inventory (every 5 minutes while this job runs)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode || 'loop' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MODE" = "once" ]; then
            ROUNDS=1
          else
            # 72 × 5 min ≈ 6 hours (job timeout is 360 min).
            ROUNDS=72
          fi

          echo "Running $ROUNDS sync round(s) (event=$EVENT_NAME mode=$MODE)"

          sync_once() {
            local label="$1"
            local url="$2"
            local out="/tmp/${label}.json"
            local status

            status=$(curl -sS -o "$out" -w "%{http_code}" \
              --max-time 200 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$url") || status="000"

            echo "[$label] HTTP $status"
            cat "$out" 2>/dev/null || true
            echo

            if [ "$status" -ge 300 ] && [ "$status" -lt 400 ]; then
              echo "::error::$label got redirect $status — scraper did not run"
              return 1
            fi
            if [ "$status" -ge 400 ] || [ "$status" = "000" ]; then
              echo "::warning::$label request failed with HTTP $status"
              return 1
            fi
            if grep -q '"status":"skipped"' "$out" 2>/dev/null; then
              echo "::notice::$label skipped (lock held by another run)"
              return 0
            fi
            if grep -q '"status":"failed"' "$out" 2>/dev/null; then
              echo "::warning::$label reported status=failed"
              return 1
            fi
            return 0
          }

          failures=0
          for i in $(seq 1 "$ROUNDS"); do
            echo "=== Round $i / $ROUNDS @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

            if ! sync_once tickets "https://www.flywithalqibla.com/api/cron/sync-tickets/"; then
              failures=$((failures + 1))
            fi
            if ! sync_once packages "https://www.flywithalqibla.com/api/cron/sync-packages/"; then
              failures=$((failures + 1))
            fi

            if [ "$i" -lt "$ROUNDS" ]; then
              echo "Sleeping 300s until next round…"
              sleep 300
            fi
          done

          # For a single manual run, fail the job if that sync failed.
          if [ "$ROUNDS" -eq 1 ] && [ "$failures" -gt 0 ]; then
            echo "::error::Sync failed"
            exit 1
          fi

          # For long loops, finish green if most rounds worked (transient scraper errors happen).
          echo "Done. Transient failures this run: $failures"
          if [ "$ROUNDS" -gt 1 ] && [ "$failures" -ge "$ROUNDS" ]; then
            echo "::error::Every round failed — check CRON_SECRET / production cron"
            exit 1
          fi
