name: Inventory Ticket Sync

# Permanent setup:
# - cron-job.org dispatches every 15 minutes (not 5 — avoids queue pileups)
# - cancel-in-progress: true so only one sync runs; old waits never fail as "failure"
# - Playwright browser cached to keep runtime ~1–2 minutes
# Publishes inventory JSON to travel-agency-inventory-cache (not linked to Vercel).

on:
  schedule:
    # Backup only — primary trigger is cron-job.org workflow_dispatch.
    - cron: "10 */3 * * *"
  workflow_dispatch:

concurrency:
  group: travelline-ticket-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Sync tickets + packages → Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELLINE_BASE_URL: ${{ secrets.TRAVELLINE_BASE_URL }}
          TRAVELLINE_ADMIN_URL: ${{ secrets.TRAVELLINE_ADMIN_URL }}
          TRAVELLINE_AGENT_USERNAME: ${{ secrets.TRAVELLINE_AGENT_USERNAME }}
          TRAVELLINE_AGENT_PASSWORD: ${{ secrets.TRAVELLINE_AGENT_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SITE_URL: https://www.flywithalqibla.com
        run: npx tsx scripts/run-travelline-scraper-sync.ts

      - name: Publish public inventory mirror (GitHub CDN)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          INVENTORY_MIRROR_REPO: mafzalkalwardev/travel-agency-inventory-cache
        run: npx tsx scripts/publish-inventory-mirror.ts
