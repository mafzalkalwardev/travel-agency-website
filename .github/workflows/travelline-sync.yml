name: Inventory Ticket Sync

# Scrapes inventory on GitHub Actions and writes to Supabase (not Vercel).
# IMPORTANT: do NOT use long-running sleep loops — those burn Actions minutes
# and hit spending limits. One short job every 2 hours is enough.

on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

concurrency:
  group: travelline-ticket-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Sync tickets + packages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELLINE_BASE_URL: ${{ secrets.TRAVELLINE_BASE_URL }}
          TRAVELLINE_ADMIN_URL: ${{ secrets.TRAVELLINE_ADMIN_URL }}
          TRAVELLINE_AGENT_USERNAME: ${{ secrets.TRAVELLINE_AGENT_USERNAME }}
          TRAVELLINE_AGENT_PASSWORD: ${{ secrets.TRAVELLINE_AGENT_PASSWORD }}
        run: npx tsx scripts/run-travelline-scraper-sync.ts
