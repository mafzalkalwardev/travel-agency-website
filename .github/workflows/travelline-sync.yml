name: Inventory Ticket Sync

# Runs the inventory scraper on GitHub Actions runners (NOT Vercel).
# Hitting /api/cron/sync-tickets on Vercel every few minutes burned Hobby
# CPU and risked pausing the whole team — keep Vercel for page serving only.
#
# Cadence: every 2 hours (inventory does not need 5-minute scrapes for a
# brochure site; admin Sync Now still works for urgent updates).

on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

concurrency:
  group: travelline-ticket-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Sync tickets + packages (writes Supabase directly)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELLINE_BASE_URL: ${{ secrets.TRAVELLINE_BASE_URL }}
          TRAVELLINE_ADMIN_URL: ${{ secrets.TRAVELLINE_ADMIN_URL }}
          TRAVELLINE_AGENT_USERNAME: ${{ secrets.TRAVELLINE_AGENT_USERNAME }}
          TRAVELLINE_AGENT_PASSWORD: ${{ secrets.TRAVELLINE_AGENT_PASSWORD }}
        run: npx tsx scripts/run-travelline-scraper-sync.ts
