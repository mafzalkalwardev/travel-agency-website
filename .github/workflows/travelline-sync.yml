name: TravelLine Ticket Sync

# Triggers the already-deployed, lock-protected /api/cron/sync-tickets
# endpoint every minute. Deliberately lightweight (no checkout/npm
# install/Playwright) — a full local scrape run here was previously
# ~1-3 min of setup overhead per invocation, impractical at a 1-minute
# cadence. Ticket sync itself never needs Playwright (only the Umrah
# package HTTP-fallback does, and that's guarded server-side). See
# docs/REDESIGN.md §4/§7.
#
# Note: GitHub Actions' schedule trigger is best-effort, not a hard
# real-time guarantee — under platform load, runs can be delayed by a
# few minutes. This is the accepted tradeoff for a free external
# scheduler; Vercel's own daily cron (vercel.json) remains as a backstop.

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

concurrency:
  group: travelline-ticket-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger ticket sync
        run: |
          # next.config.ts sets trailingSlash: true, so the bare path
          # 308-redirects — hit the trailing-slash URL directly rather
          # than relying on curl -L (which previously wasn't set here,
          # so the sync silently never ran despite a "successful" 3xx).
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            --max-time 150 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://flywithalqibla.com/api/cron/sync-tickets/)
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Sync request failed"
            exit 1
          fi
