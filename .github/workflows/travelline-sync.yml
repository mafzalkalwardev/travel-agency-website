name: TravelLine Ticket Sync (backstop)

# SECONDARY backstop only. The primary 1-minute trigger is a Supabase
# pg_cron + pg_net job (`sync-tickets-every-minute`, scheduled directly in
# the database — see docs/REDESIGN.md §6.3) calling the same
# /api/cron/sync-tickets endpoint.
#
# Why this isn't primary: measured in production 2026-07-19, GitHub
# Actions' `schedule` trigger on this repo ran roughly once per HOUR
# despite being configured for every minute — this is a real, currently
# undocumented-in-our-plan GitHub platform throttling behavior for
# low-activity repos, not a config mistake. It cannot be tuned around, so
# it was demoted to a sparse backstop rather than removed outright.
#
# Shares the same overlap lock (sync_locks table) as every other
# trigger, so running alongside pg_cron is always safe — worst case is a
# wasted "already in progress" 200 response.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: travelline-ticket-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger ticket sync
        run: |
          # next.config.ts sets trailingSlash: true, so the bare path
          # 308-redirects — hit the trailing-slash URL directly rather
          # than relying on curl -L (which previously wasn't set here,
          # so the sync silently never ran despite a "successful" 3xx).
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            --max-time 150 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://flywithalqibla.com/api/cron/sync-tickets/)
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Sync request failed"
            exit 1
          fi
