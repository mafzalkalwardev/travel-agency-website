name: Watch booking holds (expiry alerts)

# Light Vercel ping — only emails about expiring unpaid holds.
# Kept rare so it does not burn Hobby CPU. Inventory sync is separate
# and runs on GitHub Actions runners (no Vercel CPU).

on:
  schedule:
    - cron: "35 */4 * * *"
  workflow_dispatch:

concurrency:
  group: watch-booking-holds
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger hold expiry watch
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.flywithalqibla.com/api/cron/watch-booking-holds/)
          echo "HTTP status: $status"
          cat /tmp/response.json || true
          echo

          if [ "$status" -ge 300 ] && [ "$status" -lt 400 ]; then
            echo "::error::Got redirect $status — watch did not run. Use www host + trailing slash."
            exit 1
          fi

          if [ "$status" -ge 400 ]; then
            echo "::error::Hold watch failed with HTTP $status"
            exit 1
          fi
