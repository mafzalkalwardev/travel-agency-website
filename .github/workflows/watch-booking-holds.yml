name: Watch booking holds (expiry alerts)

# Unpaid seat holds expire in about an hour. Ping production so admin
# gets an email before seats drop. Inventory sync is separate
# (travelline-sync.yml).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: watch-booking-holds
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger hold expiry watch
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.flywithalqibla.com/api/cron/watch-booking-holds/)
          echo "HTTP status: $status"
          cat /tmp/response.json || true
          echo

          if [ "$status" -ge 300 ] && [ "$status" -lt 400 ]; then
            echo "::error::Got redirect $status — watch did not run. Use www host + trailing slash."
            exit 1
          fi

          if [ "$status" -ge 400 ]; then
            echo "::error::Hold watch failed with HTTP $status"
            exit 1
          fi
